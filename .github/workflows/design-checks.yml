name: document-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 scripts/check_design.py
