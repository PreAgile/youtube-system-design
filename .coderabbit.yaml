# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
tone_instructions: "결정의 논리를 먼저 검증한다. docs/review-policy.md의 Q1~Q10으로 빈틈을 찾고, 코멘트 앞에 그 문서의 분류를 붙인다."
early_access: false
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "docs/review-policy.md"
      - "docs/design/00-scope.md"
      - "docs/adr/*.md"
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: true
  auto_review:
    enabled: true
    drafts: false
  pre_merge_checks:
    custom_checks:
      - name: "결정 근거"
        mode: warning
        instructions: |
          PR이 새 결정을 담고 있다면 해당 ADR에 대안, 트레이드오프(잃는 것), 요구사항에서 도출된 평가 기준, 깨지는 조건이 모두 있는지 확인한다.
          하나라도 없으면 실패로 판정하고 빠진 항목을 적는다.
      - name: "코드와 ADR 일치"
        mode: warning
        instructions: |
          코드 변경이 Accepted ADR의 결정과 다르거나, ADR 없이 새 라이브러리, 저장소, 재시도 정책, 일관성 모델을 들여오면 실패로 판정한다.
  path_instructions:
    - path: "docs/adr/**"
      instructions: |
        docs/review-policy.md의 Q1~Q10을 섹션별로 적용한다.
        특히 가장 강한 대안이 빠졌는지(Q3), 잃는 것과 그걸 감당할 근거가 있는지(Q4), 평가표 결과와 추천이 일치하는지(Q5)를 본다.
        결론을 반박할 수 있는 가장 강한 반론을 하나 제시하고, 문서가 그 반론에 답하는지 판정한다.
    - path: "docs/capacity/**"
      instructions: |
        모든 수치에 측정 조건 또는 가정 출처가 있는지 확인한다(Q6).
        환산식의 단위와 자릿수를 직접 검산하고 결과를 코멘트에 적는다.
        로컬 측정 한계 때문에 생긴 병목과 설계 때문에 생긴 병목을 구분했는지 본다.
    - path: "docs/**"
      instructions: |
        설계 문서의 결정이 ADR로 뒷받침되는지 확인한다(Q9). ADR과 모순되는 서술은 [ADR 불일치]로 지적한다.
    - path: "**"
      instructions: |
        모든 파일에 docs/review-policy.md의 Q1~Q10과 코멘트 분류를 적용한다. 이 PR이 담은 결정이 어떤 ADR에 근거하는지 먼저 확인한다.
    - path: "**/*.{go,java,kt}"
      instructions: |
        코드가 Accepted ADR과 일치하는지 먼저 본다(Q9).
        그다음 외부 호출 타임아웃과 취소, 소비와 작업 처리의 멱등성, 상태 변경과 이벤트 발행의 원자성, 리소스 누수를 본다.
        구현 선택 중 ADR에 없는 트레이드오프가 있으면 ADR 추가가 필요한지 묻는다.
chat:
  auto_reply: true
